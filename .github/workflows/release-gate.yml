name: Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # pnpm must be available before setup-node enables pnpm caching.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: supabase_proxy/requirements.txt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r supabase_proxy/requirements.txt

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Compile backend
        run: python -m py_compile supabase_proxy/*.py

      - name: Lint frontend
        run: pnpm lint

      - name: Run regression suite
        run: pnpm test:facilitator-runtime && pnpm test:audit-stabilization

      - name: Build production frontend
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
