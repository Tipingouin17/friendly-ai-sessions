<!DOCTYPE html>
<html>
<head>
    <title>Add Bob</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <button id="btn" onclick="addBob()">Add Bob</button>
    <div id="result">Waiting...</div>

    <script>
        const supabaseUrl = 'https://dsnfzlavmakmsnbvntgs.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbmZ6bGF2bWFrbXNuYnZudGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MzgzOTIsImV4cCI6MjA4MDAxNDM5Mn0.hZh2gss_JWYFTQOUHLIYzSMn2TToxS8xIQqOXj821cc';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function addBob() {
            try {
                const { data, error } = await supabase
                    .from('session_participants')
                    .insert([
                        { conversation_id: 1600, name: 'Bob', avatar_seed: 'bob123', is_anonymous: true }
                    ])
                    .select();

                if (error) {
                    document.getElementById('result').innerText = 'Error: ' + error.message;
                } else {
                    document.getElementById('result').innerText = 'Success: ' + JSON.stringify(data);
                }
            } catch (e) {
                document.getElementById('result').innerText = 'Exception: ' + e.toString();
            }
        }
    </script>
</body>
</html>
