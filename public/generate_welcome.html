<!DOCTYPE html>
<html>

<head>
    <title>Generate Welcome Message</title>
</head>

<body>
    <h2>Generate Welcome Message</h2>
    <div id="status">Generating...</div>
    <pre id="logs"
        style="background: #f0f0f0; padding: 10px; border: 1px solid #ccc; font-family: monospace; height: 300px; overflow: auto;"></pre>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://dsnfzlavmakmsnbvntgs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzbmZ6bGF2bWFrbXNuYnZudGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MzgzOTIsImV4cCI6MjA4MDAxNDM5Mn0.hZh2gss_JWYFTQOUHLIYzSMn2TToxS8xIQqOXj821cc';

        function log(msg) {
            const el = document.getElementById('logs');
            el.innerHTML += new Date().toISOString() + ': ' + msg + '\n';
            console.log(msg);
        }

        async function generate() {
            try {
                const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                log('Client created');

                log('Invoking handle-facilitator-response...');
                const { data, error } = await client.functions.invoke('handle-facilitator-response', {
                    body: {
                        conversationId: 1599,
                        sessionStart: true,
                        messages: []
                    }
                });

                if (error) {
                    log('ERROR: ' + JSON.stringify(error));
                    document.getElementById('status').innerText = 'Generation Failed';
                    document.getElementById('status').style.color = 'red';
                } else {
                    log('Success: ' + JSON.stringify(data));
                    document.getElementById('status').innerText = 'Generation Success';
                    document.getElementById('status').style.color = 'green';
                }
            } catch (e) {
                log('EXCEPTION: ' + e.message);
                document.getElementById('status').innerText = 'Exception';
            }
        }

        generate();
    </script>
</body>

</html>
